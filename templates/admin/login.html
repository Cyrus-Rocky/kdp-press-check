<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - KDP Press Check</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f12;
      color: #f0f0f3;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: rgba(31, 31, 38, 0.8);
      border: 1.5px solid rgba(240, 240, 243, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: #f97316;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      color: #fff;
    }
    .login-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .login-header p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: rgba(240, 240, 243, 0.6);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid rgba(240, 240, 243, 0.15);
      border-radius: 8px;
      background: rgba(31, 31, 38, 0.3);
      color: #f0f0f3;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #f97316;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #ea580c;
    }
    .error {
      color: #ef4444;
      font-size: 14px;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
      border-left: 3px solid #ef4444;
    }
    .note {
      font-size: 12px;
      color: rgba(240, 240, 243, 0.5);
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">🔑</div>
      <h1>Admin Dashboard</h1>
      <p>KDP Press Check</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="password">Temporary Password</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit">Enter Dashboard</button>
    </form>

    <div class="note">
      Temporary login. Will upgrade to real auth soon.
    </div>
  </div>
</body>
</html>
