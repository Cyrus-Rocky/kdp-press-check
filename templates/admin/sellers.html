{% extends "admin/base.html" %}

{% block title %}Sellers Management{% endblock %}
{% block header %}Seller Management{% endblock %}

{% block content %}
<div class="card">
  <h2>Add New Seller</h2>
  <form id="add-seller-form" style="display: grid; gap: 16px;">
    <div>
      <label for="seller-name">Seller Name</label>
      <input type="text" id="seller-name" name="name" placeholder="e.g. John Smith" required style="width: 100%; padding: 10px; border: 1px solid rgba(240, 240, 243, 0.15); border-radius: 6px; background: rgba(31, 31, 38, 0.3); color: #f0f0f3; font-size: 14px;">
    </div>
    <div>
      <label for="seller-link">Profile Link</label>
      <input type="url" id="seller-link" name="profile_link" placeholder="https://protalenthub.com/seller/..." required style="width: 100%; padding: 10px; border: 1px solid rgba(240, 240, 243, 0.15); border-radius: 6px; background: rgba(31, 31, 38, 0.3); color: #f0f0f3; font-size: 14px;">
    </div>
    <div>
      <label for="seller-source">Source</label>
      <select id="seller-source" name="source" style="width: 100%; padding: 10px; border: 1px solid rgba(240, 240, 243, 0.15); border-radius: 6px; background: rgba(31, 31, 38, 0.3); color: #f0f0f3; font-size: 14px;">
        <option value="manual">Manual Input</option>
        <option value="protalent_hub">ProTalent Hub</option>
      </select>
    </div>
    <button type="submit" class="btn">Add Seller</button>
  </form>
  <div id="add-status" style="margin-top: 16px; display: none;"></div>
</div>

<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h2 style="margin: 0;">Sellers List</h2>
    <button id="sync-btn" class="btn" onclick="syncProTalent()">🔄 Sync ProTalent Hub</button>
  </div>
  <div id="sync-status" style="margin-bottom: 16px; display: none; padding: 12px; background: rgba(34, 197, 94, 0.1); border-radius: 6px;"></div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Profile Link</th>
        <th>Source</th>
        <th>Verified</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="sellers-tbody">
      <tr><td colspan="6" style="text-align: center; color: rgba(240, 240, 243, 0.5);">Loading sellers...</td></tr>
    </tbody>
  </table>
</div>

<script>
// Load sellers on page load
document.addEventListener('DOMContentLoaded', loadSellers);

// Add seller form submission
document.getElementById('add-seller-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('seller-name').value;
  const profile_link = document.getElementById('seller-link').value;
  const source = document.getElementById('seller-source').value;

  const status = document.getElementById('add-status');
  status.style.display = 'block';
  status.textContent = 'Adding seller...';

  try {
    const response = await fetch('/admin/api/sellers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, profile_link, source })
    });

    if (response.ok) {
      status.style.background = 'rgba(34, 197, 94, 0.1)';
      status.style.color = '#22c55e';
      status.textContent = '✅ Seller added successfully';
      document.getElementById('add-seller-form').reset();
      loadSellers();
    } else if (response.status === 409) {
      status.style.background = 'rgba(239, 68, 68, 0.1)';
      status.style.color = '#ef4444';
      status.textContent = '❌ Seller already exists';
    } else {
      const error = await response.json();
      status.style.background = 'rgba(239, 68, 68, 0.1)';
      status.style.color = '#ef4444';
      status.textContent = `❌ Error: ${error.error || 'Unknown error'}`;
    }
  } catch (err) {
    status.style.background = 'rgba(239, 68, 68, 0.1)';
    status.style.color = '#ef4444';
    status.textContent = `❌ Error: ${err.message}`;
  }
});

async function loadSellers() {
  try {
    const response = await fetch('/admin/api/sellers');
    const sellers = await response.json();

    const tbody = document.getElementById('sellers-tbody');

    if (sellers.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: rgba(240, 240, 243, 0.5);">No sellers yet</td></tr>';
      return;
    }

    tbody.innerHTML = sellers.map(seller => `
      <tr>
        <td><strong>${seller.name}</strong></td>
        <td><a href="${seller.profile_link}" target="_blank" style="color: #f97316; text-decoration: none;">View Profile</a></td>
        <td>${seller.source === 'protalent_hub' ? 'ProTalent Hub' : 'Manual'}</td>
        <td>${seller.verified_at ? '✅ Yes' : '❌ No'}</td>
        <td><span class="status-badge ${seller.verified_at ? 'status-verified' : 'status-unverified'}">${seller.verified_at ? 'Verified' : 'Unverified'}</span></td>
        <td>
          <button class="btn" onclick="verifySeller(${seller.id})">Verify</button>
          <button class="btn btn-danger" onclick="deleteSeller(${seller.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('sellers-tbody').innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444;">Error loading sellers: ${err.message}</td></tr>`;
  }
}

async function verifySeller(sellerId) {
  try {
    const response = await fetch(`/admin/api/sellers/${sellerId}/verify`, {
      method: 'POST'
    });

    if (response.ok) {
      loadSellers();
      alert('Seller verified successfully');
    } else {
      alert('Failed to verify seller');
    }
  } catch (err) {
    alert(`Error: ${err.message}`);
  }
}

async function deleteSeller(sellerId) {
  if (confirm('Are you sure you want to delete this seller?')) {
    try {
      const response = await fetch(`/admin/api/sellers/${sellerId}`, {
        method: 'DELETE'
      });

      if (response.ok) {
        loadSellers();
      } else {
        alert('Failed to delete seller');
      }
    } catch (err) {
      alert(`Error: ${err.message}`);
    }
  }
}

async function syncProTalent() {
  const btn = document.getElementById('sync-btn');
  const status = document.getElementById('sync-status');

  btn.disabled = true;
  btn.textContent = '⏳ Syncing...';
  status.style.display = 'block';
  status.textContent = 'Syncing from ProTalent Hub...';

  try {
    const response = await fetch('/admin/api/sellers/sync-protalent', {
      method: 'POST'
    });

    const result = await response.json();

    if (response.ok) {
      status.style.background = 'rgba(34, 197, 94, 0.1)';
      status.style.color = '#22c55e';
      status.innerHTML = `✅ Sync complete: ${result.added} added, ${result.synced} updated`;
      loadSellers();
    } else {
      status.style.background = 'rgba(239, 68, 68, 0.1)';
      status.style.color = '#ef4444';
      status.textContent = `❌ Sync failed: ${result.error}`;
    }
  } catch (err) {
    status.style.background = 'rgba(239, 68, 68, 0.1)';
    status.style.color = '#ef4444';
    status.textContent = `❌ Error: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Sync ProTalent Hub';
  }
}
</script>

<style>
  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  a {
    color: #f97316;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
