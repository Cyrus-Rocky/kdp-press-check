<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin Dashboard{% endblock %} - KDP Press Check</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f12;
      color: #f0f0f3;
      margin: 0;
      padding: 0;
    }
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    .admin-sidebar {
      width: 240px;
      background: rgba(31, 31, 38, 0.8);
      border-right: 1px solid rgba(240, 240, 243, 0.1);
      padding: 24px 16px;
      overflow-y: auto;
    }
    .admin-sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(249, 115, 22, 0.1);
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      font-size: 14px;
    }
    .admin-sidebar-logo svg {
      width: 28px;
      height: 28px;
    }
    .admin-nav-group {
      margin-bottom: 24px;
    }
    .admin-nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(240, 240, 243, 0.5);
      margin-bottom: 8px;
      padding: 0 12px;
    }
    .admin-nav-link {
      display: block;
      padding: 10px 12px;
      color: inherit;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: background 0.2s;
      margin-bottom: 4px;
    }
    .admin-nav-link:hover {
      background: rgba(240, 240, 243, 0.1);
    }
    .admin-nav-link.active {
      background: rgba(249, 115, 22, 0.2);
      color: #f97316;
      font-weight: 600;
    }
    .admin-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(240, 240, 243, 0.1);
    }
    .admin-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .admin-logout {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .admin-logout:hover {
      background: #dc2626;
    }
    .card {
      background: rgba(31, 31, 38, 0.5);
      border: 1px solid rgba(240, 240, 243, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background: rgba(240, 240, 243, 0.05);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid rgba(240, 240, 243, 0.1);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid rgba(240, 240, 243, 0.05);
    }
    button.btn {
      padding: 8px 16px;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }
    button.btn:hover {
      background: #ea580c;
    }
    button.btn-danger {
      background: #ef4444;
    }
    button.btn-danger:hover {
      background: #dc2626;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-verified {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }
    .status-pending {
      background: rgba(249, 115, 22, 0.2);
      color: #f97316;
    }
    .status-unverified {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    @media (max-width: 768px) {
      .admin-layout {
        flex-direction: column;
      }
      .admin-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(240, 240, 243, 0.1);
      }
      .admin-content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard" class="admin-sidebar-logo">
        <span>🔑</span>
        Admin
      </a>

      <div class="admin-nav-group">
        <div class="admin-nav-group-title">Navigation</div>
        <a href="/admin/dashboard" class="admin-nav-link {% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/admin/sellers" class="admin-nav-link {% if page == 'sellers' %}active{% endif %}">Sellers</a>
        <a href="/admin/health" class="admin-nav-link {% if page == 'health' %}active{% endif %}">System Health</a>
        <a href="/admin/feedback" class="admin-nav-link {% if page == 'feedback' %}active{% endif %}">Author Feedback</a>
      </div>

      <div class="admin-nav-group">
        <form method="POST" action="/admin/logout" style="margin: 0;">
          <button type="submit" class="admin-logout" style="width: 100%; margin-top: 24px;">Logout</button>
        </form>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <h1>{% block header %}Page{% endblock %}</h1>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
